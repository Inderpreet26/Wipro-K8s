apiVersion: apps/v1
kind: Deployment
metadata:
  name: veg-deployment
spec:
  replicas: 3
  selector:
    matchLabels:
      app: veg
  template:
    metadata:
      labels:
        app: veg
    spec:
      containers:
        - name: vegetable-container
          image: inderpreet26/veg:v2.0.0
          ports:
            - containerPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: veg-service
spec:
  selector:
    app: veg
  ports:
    - protocol: TCP
      port: 3000
      targetPort: 3000
  type: ClusterIP